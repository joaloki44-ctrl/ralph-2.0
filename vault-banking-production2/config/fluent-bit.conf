# =============================================================================
# FLUENTBIT CONFIGURATION - Audit Logs avec Signature HMAC
# =============================================================================
# Fichier: /etc/fluent-bit/fluent-bit.conf
# Description: Collecte logs Vault + signature HMAC + upload S3 WORM
# Conformité: ACPR (immutabilité), RGPD
# =============================================================================

[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    Plugins_File plugins.conf
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020
    storage.path /var/lib/fluent-bit/

# =============================================================================
# INPUT - Vault Audit Logs
# =============================================================================

[INPUT]
    Name              tail
    Path              /vault/audit/audit.log
    Parser            json
    Tag               vault.audit
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    DB                /var/lib/fluent-bit/vault-audit.db

# =============================================================================
# FILTER 1 - Enrichissement Metadata
# =============================================================================

[FILTER]
    Name    modify
    Match   vault.audit.*
    
    # Ajout metadata serveur
    Add     hostname ${HOSTNAME}
    Add     datacenter DATACENTER_PLACEHOLDER
    Add     environment production
    Add     collector_version 2.2.0

# =============================================================================
# FILTER 2 - Signature HMAC (Lua Script)
# =============================================================================

[FILTER]
    Name    lua
    Match   vault.audit.*
    script  /etc/fluent-bit/scripts/hmac-sign.lua
    call    sign_audit_log

# =============================================================================
# FILTER 3 - Détection Anomalies (Patterns Suspects)
# =============================================================================

[FILTER]
    Name    lua
    Match   vault.audit.*
    script  /etc/fluent-bit/scripts/anomaly-detector.lua
    call    detect_anomaly

# =============================================================================
# OUTPUT 1 - S3 Object Storage (WORM) - Primaire
# =============================================================================

[OUTPUT]
    Name                s3
    Match               vault.audit.*
    
    # Scaleway Object Storage (région France)
    bucket              vault-audit-prod
    endpoint            https://s3.fr-par.scw.cloud
    region              fr-par
    
    # Credentials (depuis environnement)
    # AWS_ACCESS_KEY_ID et AWS_SECRET_ACCESS_KEY
    
    # Compression et upload
    store_dir           /tmp/fluent-bit-s3
    total_file_size     50M
    upload_timeout      2m
    compression         gzip
    
    # Structure S3 (date-based partitioning)
    s3_key_format       /year=%Y/month=%m/day=%d/hour=%H/vault-audit-%Y%m%d-%H%M%S-$UUID.json.gz
    
    # Object Lock (WORM mode) - défini au niveau bucket S3
    use_put_object      true
    
    # Retry configuration
    retry_limit         5
    
    # Storage class (Standard pour accès fréquent audit)
    storage_class       STANDARD

# =============================================================================
# OUTPUT 2 - Syslog Redondant (backup local)
# =============================================================================

[OUTPUT]
    Name    syslog
    Match   vault.audit.*
    host    127.0.0.1
    port    514
    mode    tcp
    syslog_format        rfc5424
    syslog_hostname_key  hostname
    syslog_appname_key   vault-audit
    syslog_procid_key    pid
    syslog_message_key   log

# =============================================================================
# OUTPUT 3 - Prometheus Metrics (monitoring pipeline)
# =============================================================================

[OUTPUT]
    Name          prometheus_exporter
    Match         vault.audit.*
    host          0.0.0.0
    port          2021
    
    # Métriques exposées
    add_label     app vault-audit-pipeline
    add_label     environment production

# =============================================================================
# NOTES CONFIGURATION
# =============================================================================

# Variables environnement requises:
# - AWS_ACCESS_KEY_ID: Scaleway S3 access key
# - AWS_SECRET_ACCESS_KEY: Scaleway S3 secret key
# - HOSTNAME: Hostname du serveur
# - DATACENTER_PLACEHOLDER: paris-dc1, paris-dc2, ou lyon

# Fichiers Lua requis:
# - /etc/fluent-bit/scripts/hmac-sign.lua
# - /etc/fluent-bit/scripts/anomaly-detector.lua

# S3 Bucket Configuration (à créer au préalable):
# - Versioning: Enabled
# - Object Lock: Compliance mode, 90 days retention
# - Lifecycle: Transition to Glacier after 1 year
# - MFA Delete: Enabled

# Performance:
# - Buffer: 50MB par input
# - Flush: 5 secondes
# - Upload S3: Quand fichier atteint 50MB ou timeout 2min

# Monitoring:
# - Prometheus metrics: http://localhost:2021/metrics
# - FluentBit status: http://localhost:2020/api/v1/health

# Compliance:
# - ACPR: Logs immutables (S3 WORM + signature HMAC)
# - RGPD: Logs peuvent être crypto-shredded via rotation clé HMAC
# - DORA: Résilience via double output (S3 + syslog)
