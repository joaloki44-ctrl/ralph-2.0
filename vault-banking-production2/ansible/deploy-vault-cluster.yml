---
# =============================================================================
# VAULT BANKING PRODUCTION - Playbook Ansible Principal
# =============================================================================
# Description: Déploiement complet cluster Vault 3 nodes (HA)
# Environnement: Production bancaire France
# Conformité: ACPR, RGPD, DORA, PCI-DSS
# Version: 1.0.0
# =============================================================================

- name: "VAULT BANKING DEPLOYMENT - Production France"
  hosts: vault_cluster
  become: yes
  gather_facts: yes
  
  vars:
    vault_version: "1.18.3+ent"
    vault_user: "vault"
    vault_group: "vault"
    vault_home: "/vault"
    vault_config_dir: "/etc/vault.d"
    vault_data_dir: "/vault/data"
    vault_audit_dir: "/vault/audit"
    vault_tls_dir: "/vault/tls"
    vault_backup_dir: "/vault/snapshots"
    
    # HSM Configuration (Thales nShield)
    hsm_lib_path: "/opt/nfast/toolkits/pkcs11/libcknfast.so"
    
    # Network Configuration
    vault_api_port: 8200
    vault_cluster_port: 8201
    
    # Security
    vault_disable_mlock: false
    vault_disable_cache: true
    
  pre_tasks:
    - name: "PRE-CHECK - Vérifier privilèges root"
      fail:
        msg: "Ce playbook DOIT être exécuté avec privilèges root"
      when: ansible_user_uid != 0
      
    - name: "PRE-CHECK - Vérifier version OS"
      fail:
        msg: "OS non supporté. Requis: RHEL 9.x ou Ubuntu 24.04 LTS"
      when: >
        (ansible_distribution != "RedHat" or ansible_distribution_major_version != "9") and
        (ansible_distribution != "Ubuntu" or ansible_distribution_version != "24.04")
    
    - name: "PRE-CHECK - Vérifier connectivité HSM"
      shell: |
        /opt/nfast/bin/enquiry | grep "Module #" | grep "operational"
      register: hsm_check
      failed_when: hsm_check.rc != 0
      changed_when: false
      
    - name: "PRE-CHECK - Vérifier espace disque"
      assert:
        that:
          - item.size_available > 100000000000  # 100GB minimum
        fail_msg: "Espace disque insuffisant sur {{ item.mount }}"
      loop: "{{ ansible_mounts }}"
      when: item.mount == '/vault'

  tasks:
    # =========================================================================
    # PHASE 1: SYSTÈME - Hardening OS selon ANSSI
    # =========================================================================
    
    - name: "SYSTÈME - Installation packages requis"
      package:
        name:
          - unzip
          - jq
          - curl
          - openssl
          - ca-certificates
          - aide  # Integrity checker
          - auditd  # Kernel audit
        state: present
        
    - name: "SYSTÈME - Désactivation services inutiles"
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - avahi-daemon
        - cups
        - bluetooth
      ignore_errors: yes
      
    - name: "SYSTÈME - Configuration kernel hardening"
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        # Anti-debug (bloque gcore, ptrace)
        - { name: 'kernel.yama.ptrace_scope', value: '3' }
        - { name: 'kernel.dmesg_restrict', value: '1' }
        - { name: 'kernel.kptr_restrict', value: '2' }
        
        # Network security
        - { name: 'net.ipv4.tcp_syncookies', value: '1' }
        - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.all.accept_source_route', value: '0' }
        - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
        
        # Disable IPv6 si non utilisé
        - { name: 'net.ipv6.conf.all.disable_ipv6', value: '1' }
        
    - name: "SYSTÈME - Configuration auditd (audit kernel)"
      copy:
        dest: /etc/audit/rules.d/vault-security.rules
        content: |
          # Audit Vault security events
          -w /vault/data -p wa -k vault-data-access
          -w /etc/vault.d -p wa -k vault-config-change
          -w /vault/tls -p r -k vault-tls-access
          -a always,exit -F arch=b64 -S ptrace -k vault-debug-attempt
      notify: restart auditd

    # =========================================================================
    # PHASE 2: UTILISATEURS & PERMISSIONS
    # =========================================================================
    
    - name: "USER - Création groupe vault"
      group:
        name: "{{ vault_group }}"
        state: present
        system: yes
        
    - name: "USER - Création utilisateur vault"
      user:
        name: "{{ vault_user }}"
        group: "{{ vault_group }}"
        home: "{{ vault_home }}"
        shell: /bin/bash
        system: yes
        create_home: no
        
    - name: "USER - Création répertoires Vault"
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: '0750'
      loop:
        - "{{ vault_home }}"
        - "{{ vault_config_dir }}"
        - "{{ vault_data_dir }}"
        - "{{ vault_audit_dir }}"
        - "{{ vault_tls_dir }}"
        - "{{ vault_backup_dir }}"
        - "{{ vault_home }}/plugins"
        - /var/log/vault

    # =========================================================================
    # PHASE 3: INSTALLATION VAULT ENTERPRISE
    # =========================================================================
    
    - name: "VAULT - Téléchargement binaire Enterprise"
      get_url:
        url: "https://releases.hashicorp.com/vault/{{ vault_version }}/vault_{{ vault_version }}_linux_amd64.zip"
        dest: /tmp/vault.zip
        checksum: "sha256:CHECKSUM_PLACEHOLDER"  # Vérifier sur releases.hashicorp.com
        mode: '0644'
        
    - name: "VAULT - Extraction binaire"
      unarchive:
        src: /tmp/vault.zip
        dest: /usr/local/bin
        remote_src: yes
        mode: '0755'
        
    - name: "VAULT - Vérification version installée"
      command: vault version
      register: vault_version_check
      changed_when: false
      
    - name: "VAULT - Attribution capabilities (mlock)"
      capabilities:
        path: /usr/local/bin/vault
        capability: cap_ipc_lock=+ep
        state: present

    # =========================================================================
    # PHASE 4: CERTIFICATS TLS (mTLS)
    # =========================================================================
    
    - name: "TLS - Copie CA certificate"
      copy:
        src: "{{ playbook_dir }}/../tls/ca.pem"
        dest: "{{ vault_tls_dir }}/ca.pem"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: '0644'
        
    - name: "TLS - Copie certificat node"
      copy:
        src: "{{ playbook_dir }}/../tls/{{ inventory_hostname }}-cert.pem"
        dest: "{{ vault_tls_dir }}/vault-cert.pem"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: '0644'
        
    - name: "TLS - Copie clé privée node"
      copy:
        src: "{{ playbook_dir }}/../tls/{{ inventory_hostname }}-key.pem"
        dest: "{{ vault_tls_dir }}/vault-key.pem"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: '0400'  # Read-only pour vault user

    # =========================================================================
    # PHASE 5: CONFIGURATION VAULT
    # =========================================================================
    
    - name: "CONFIG - Déploiement fichier configuration"
      template:
        src: "{{ playbook_dir }}/../config/vault-production.hcl"
        dest: "{{ vault_config_dir }}/vault.hcl"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: '0640'
      notify: restart vault
      
    - name: "CONFIG - Variables environnement HSM"
      copy:
        dest: /etc/vault.d/vault.env
        content: |
          VAULT_HSM_PIN={{ vault_hsm_pin }}
          VAULT_HSM_PIN_SECONDARY={{ vault_hsm_pin_secondary }}
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: '0400'
      no_log: true  # Pas de log des secrets

    # =========================================================================
    # PHASE 6: SYSTEMD SERVICE
    # =========================================================================
    
    - name: "SYSTEMD - Création service Vault"
      copy:
        dest: /etc/systemd/system/vault.service
        content: |
          [Unit]
          Description=HashiCorp Vault - Banking Grade Secret Management
          Documentation=https://developer.hashicorp.com/vault/docs
          Requires=network-online.target
          After=network-online.target
          ConditionFileNotEmpty={{ vault_config_dir }}/vault.hcl
          
          [Service]
          Type=notify
          User={{ vault_user }}
          Group={{ vault_group }}
          ProtectSystem=full
          ProtectHome=read-only
          PrivateTmp=yes
          PrivateDevices=yes
          SecureBits=keep-caps
          AmbientCapabilities=CAP_IPC_LOCK
          CapabilityBoundingSet=CAP_SYSLOG CAP_IPC_LOCK
          NoNewPrivileges=yes
          
          EnvironmentFile={{ vault_config_dir }}/vault.env
          ExecStart=/usr/local/bin/vault server -config={{ vault_config_dir }}/vault.hcl
          ExecReload=/bin/kill --signal HUP $MAINPID
          KillMode=process
          KillSignal=SIGINT
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=30
          LimitNOFILE=65536
          LimitMEMLOCK=infinity
          
          [Install]
          WantedBy=multi-user.target
        mode: '0644'
        
    - name: "SYSTEMD - Reload daemon"
      systemd:
        daemon_reload: yes
        
    - name: "SYSTEMD - Enable et start Vault"
      systemd:
        name: vault
        state: started
        enabled: yes

    # =========================================================================
    # PHASE 7: MONITORING & OBSERVABILITY
    # =========================================================================
    
    - name: "MONITORING - Installation node_exporter"
      get_url:
        url: https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
        dest: /tmp/node_exporter.tar.gz
        
    - name: "MONITORING - Extraction node_exporter"
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /usr/local/bin
        remote_src: yes
        extra_opts:
          - --strip-components=1
          
    - name: "MONITORING - Service node_exporter"
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target
          
          [Service]
          Type=simple
          User=prometheus
          ExecStart=/usr/local/bin/node_exporter \
            --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
          Restart=on-failure
          
          [Install]
          WantedBy=multi-user.target
      notify: restart node_exporter

    # =========================================================================
    # PHASE 8: BACKUP & DR
    # =========================================================================
    
    - name: "BACKUP - Script snapshot chiffré"
      template:
        src: "{{ playbook_dir }}/../scripts/vault-snapshot-encrypted.sh"
        dest: /usr/local/bin/vault-snapshot-encrypted.sh
        mode: '0750'
        owner: "{{ vault_user }}"
        
    - name: "BACKUP - Cron snapshots (toutes les 6h)"
      cron:
        name: "Vault snapshot encrypted"
        minute: "0"
        hour: "*/6"
        user: "{{ vault_user }}"
        job: "/usr/local/bin/vault-snapshot-encrypted.sh >> /var/log/vault/snapshots.log 2>&1"

    # =========================================================================
    # PHASE 9: VALIDATION POST-INSTALLATION
    # =========================================================================
    
    - name: "VALIDATION - Attente démarrage Vault"
      wait_for:
        port: "{{ vault_api_port }}"
        delay: 5
        timeout: 60
        
    - name: "VALIDATION - Health check"
      uri:
        url: "https://{{ ansible_fqdn }}:{{ vault_api_port }}/v1/sys/health"
        method: GET
        validate_certs: yes
        client_cert: "{{ vault_tls_dir }}/vault-cert.pem"
        client_key: "{{ vault_tls_dir }}/vault-key.pem"
        return_content: yes
      register: health_check
      retries: 5
      delay: 10
      until: health_check.status == 200 or health_check.status == 501  # 501 = not initialized (OK)
      
    - name: "VALIDATION - Affichage status"
      debug:
        msg: "Vault {{ inventory_hostname }} démarré avec succès. Sealed: {{ health_check.json.sealed | default('unknown') }}"

  handlers:
    - name: restart vault
      systemd:
        name: vault
        state: restarted
        
    - name: restart auditd
      systemd:
        name: auditd
        state: restarted
        
    - name: restart node_exporter
      systemd:
        name: node_exporter
        state: restarted

# =============================================================================
# POST-DEPLOYMENT MANUAL STEPS (run once per cluster)
# =============================================================================
# 
# 1. INITIALISATION CLUSTER (sur vault-01 uniquement):
#    vault operator init -recovery-shares=5 -recovery-threshold=3
#    → Sauvegarder recovery keys dans coffre-fort physique
#
# 2. VÉRIFICATION AUTO-UNSEAL HSM:
#    vault status
#    → Doit afficher: Sealed=false (auto-unseal via HSM)
#
# 3. CONFIGURATION AUDIT DEVICE:
#    vault audit enable file file_path=/vault/audit/audit.log
#
# 4. ACTIVATION AUTH METHODS:
#    vault auth enable ldap
#    vault auth enable approle
#
# 5. TESTS FAILOVER:
#    systemctl stop vault  # Sur node actif
#    → Vérifier élection nouveau leader < 30s
#
# =============================================================================
