# =============================================================================
# VAULT BANKING PRODUCTION - Ansible Inventory
# =============================================================================
# Fichier: ansible/inventory/production.ini
# Description: Inventaire production cluster Vault 3 nodes
# Environnement: Production bancaire France
# =============================================================================

# -----------------------------------------------------------------------------
# VAULT CLUSTER (3 nodes HA)
# -----------------------------------------------------------------------------
[vault_cluster]
vault-01 ansible_host=10.0.10.10 node_id=vault-01 datacenter=paris-dc1
vault-02 ansible_host=10.0.10.11 node_id=vault-02 datacenter=paris-dc2
vault-03 ansible_host=10.0.10.12 node_id=vault-03 datacenter=lyon

# -----------------------------------------------------------------------------
# VARIABLES GLOBALES CLUSTER
# -----------------------------------------------------------------------------
[vault_cluster:vars]
# Ansible SSH
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Vault Version
vault_version=1.18.3+ent
vault_download_url=https://releases.hashicorp.com/vault

# Directories
vault_user=vault
vault_group=vault
vault_home=/vault
vault_config_dir=/etc/vault.d
vault_data_dir=/vault/data
vault_audit_dir=/vault/audit
vault_tls_dir=/vault/tls
vault_backup_dir=/vault/snapshots
vault_plugin_dir=/vault/plugins

# Network
vault_api_port=8200
vault_cluster_port=8201

# TLS (mTLS obligatoire)
vault_tls_disable=false
vault_tls_min_version=tls12

# HSM Thales nShield
hsm_lib_path=/opt/nfast/toolkits/pkcs11/libcknfast.so
vault_hsm_pin={{ vault_password }}  # Vault Ansible encrypted
vault_hsm_pin_secondary={{ vault_password_secondary }}

# Security
vault_disable_mlock=false
vault_disable_cache=true
vault_log_level=info
vault_log_format=json

# Performance
vault_max_lease_ttl=768h
vault_default_lease_ttl=168h

# Telemetry
vault_telemetry_prometheus_retention=60s
vault_telemetry_disable_hostname=true

# S3 Backup (Scaleway Object Storage)
vault_s3_bucket=vault-backups-prod
vault_s3_region=fr-par
vault_s3_endpoint=https://s3.fr-par.scw.cloud
vault_s3_access_key={{ s3_access_key }}  # Vault Ansible encrypted
vault_s3_secret_key={{ s3_secret_key }}  # Vault Ansible encrypted

# Monitoring
pagerduty_integration_key={{ pagerduty_key }}  # Vault Ansible encrypted
prometheus_scrape_interval=30s
grafana_url=https://grafana.bank.internal

# LDAP Authentication
ldap_url=ldaps://ldap.bank.internal
ldap_userdn=ou=users,dc=bank,dc=internal
ldap_groupdn=ou=groups,dc=bank,dc=internal
ldap_binddn=cn=vault,ou=service-accounts,dc=bank,dc=internal
ldap_bindpass={{ ldap_bind_password }}  # Vault Ansible encrypted

# -----------------------------------------------------------------------------
# GROUPES PAR DATACENTER (pour opérations ciblées)
# -----------------------------------------------------------------------------
[dc_paris_1]
vault-01

[dc_paris_2]
vault-02

[dc_lyon]
vault-03

# -----------------------------------------------------------------------------
# MONITORING (si déployé séparément)
# -----------------------------------------------------------------------------
[monitoring]
prometheus-01 ansible_host=10.0.20.10
grafana-01 ansible_host=10.0.20.11

[monitoring:vars]
ansible_user=root

# -----------------------------------------------------------------------------
# AUDIT (FluentBit collectors)
# -----------------------------------------------------------------------------
[audit_collectors]
fluentbit-01 ansible_host=10.0.30.10

[audit_collectors:vars]
ansible_user=root
fluentbit_version=2.2.0

# -----------------------------------------------------------------------------
# VARIABLES D'ENVIRONNEMENT
# -----------------------------------------------------------------------------
# Les variables sensibles sont stockées dans:
# - ansible/secrets.yml (chiffré avec ansible-vault)
# 
# Pour éditer les secrets:
#   ansible-vault edit ansible/secrets.yml
# 
# Pour exécuter un playbook:
#   ansible-playbook -i inventory/production.ini playbook.yml --ask-vault-pass
# 
# Variables sensibles requises dans secrets.yml:
#   vault_password: "XXXX"           # PIN HSM primaire
#   vault_password_secondary: "YYYY" # PIN HSM secondaire
#   s3_access_key: "ZZZZ"            # Scaleway S3 access key
#   s3_secret_key: "AAAA"            # Scaleway S3 secret key
#   pagerduty_key: "BBBB"            # PagerDuty integration key
#   ldap_bind_password: "CCCC"       # LDAP bind password
# -----------------------------------------------------------------------------
